name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu / hexium-browser + Chrome 151
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install hexium-browser
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev,geoip]'
          python -c "import hexium_browser; print(hexium_browser.__version__)"
          hexium-browser --help

      - name: System libraries for Chrome
        run: python -m playwright install-deps

      - name: Setup Hexium binary
        uses: ./.github/actions/setup-hexium

      - name: Unit tests
        run: python -m pytest -m 'not slow' -q --tb=short

      - name: Launch smoke
        run: |
          hexium-browser info
          python - <<'PY'
          from hexium_browser import launch

          browser = launch(headless=True)
          page = browser.new_page()
          page.goto("about:blank")
          assert page.url.startswith("about:blank")
          browser.close()
          print("launch() ok")
          PY
